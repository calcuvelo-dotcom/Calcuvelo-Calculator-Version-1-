<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Calcuvelo">
  <defs>
    <linearGradient id="cv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <!-- brand tile -->
  <rect width="64" height="64" rx="16" fill="url(#cv-bg)"/>
  <!-- abstract "velocity equals" mark: two motion bars leaning forward + a go dot -->
  <g transform="rotate(-11 32 32)">
    <rect x="13" y="21" width="34" height="8" rx="4" fill="#ffffff"/>
    <rect x="13" y="35" width="23" height="8" rx="4" fill="#ffffff" opacity="0.92"/>
    <circle cx="45" cy="39" r="5" fill="#34d399"/>
  </g>
</svg>
